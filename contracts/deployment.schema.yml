schema: zq-platform/deployment/v1
payload:
  service: GitHub repository name; also the server compose directory name.
  repository: Full GitHub repository name.
  sha: Source commit associated with the images.
  image_refs: Object of logical image names to immutable registry references ending in @sha256:digest.
deployment:
  runner: Organization runner with labels [self-hosted, linux, x64, zq-deploy].
  manifest: /etc/zq-deploy/deployments/<service>/compose.yml
  command: write RUNTIME_ENV to the service .env when configured, docker compose pull, then docker compose up -d --remove-orphans --force-recreate, then poll docker compose ps until every service is running and healthy (300 second timeout).
status:
  in_progress: Created before the compose rollout starts.
  success: All compose services are running and every configured healthcheck reports healthy.
  failure: The compose rollout failed, a service stayed unhealthy for 300 seconds, or the deployment was cancelled.
security:
  - Business workflows never receive server hostnames, SSH keys, or server credentials.
  - Registry credentials come from DOCKER_USERNAME and DOCKER_PASSWORD secrets.
  - Runtime environment values come from the RUNTIME_ENV secret and are written to the server .env during deployment.
  - Only immutable image references are deployed.
