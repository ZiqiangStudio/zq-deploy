x-app: &app
  image: ${BACKEND_IMAGE_REF:?BACKEND_IMAGE_REF is required}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - traefik

services:
  web:
    <<: *app
    env_file: ./.env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
    mem_limit: 512m
    cpus: 1.5
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.__ROUTER__.rule: Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)
      traefik.http.routers.__ROUTER__.entrypoints: websecure
      traefik.http.routers.__ROUTER__.tls: "true"
      traefik.http.routers.__ROUTER__.tls.certresolver: ziqiang-ali
      traefik.http.services.__ROUTER__.loadbalancer.server.port: "8000"

  mailer:
    <<: *app
    env_file: ./.env
    command: ["python", "manage.py", "run_invitation_mailer", "--interval", "30"]
    environment:
      TZ: Asia/Shanghai
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 128m
    stop_grace_period: 45s

networks:
  traefik:
    external: true
