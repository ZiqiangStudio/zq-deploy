name: Registry login
description: Authenticate Docker to a registry through a provider adapter.
inputs:
  provider:
    description: Registry credential provider (github, static, or aliyun-acr).
    required: true
  registry:
    description: Registry hostname without a scheme.
    required: true
  username:
    description: Static registry username.
    required: false
    default: ''
  password:
    description: Static registry password or token.
    required: false
    default: ''
  oidc-provider-arn:
    description: Alibaba RAM OIDC provider ARN.
    required: false
    default: ''
  role-arn:
    description: Alibaba RAM role ARN assumed through OIDC.
    required: false
    default: ''
  role-session-name:
    description: Alibaba RAM role session name.
    required: false
    default: github-actions
  audience:
    description: OIDC audience configured in Alibaba RAM.
    required: false
    default: sts.aliyuncs.com
  region-id:
    description: Alibaba Cloud region containing the ACR instance.
    required: false
    default: ''
  instance-id:
    description: Alibaba ACR Enterprise instance ID.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate registry adapter configuration
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
        OIDC_PROVIDER_ARN: ${{ inputs.oidc-provider-arn }}
        ROLE_ARN: ${{ inputs.role-arn }}
        REGION_ID: ${{ inputs.region-id }}
        INSTANCE_ID: ${{ inputs.instance-id }}
      run: |
        set -Eeuo pipefail
        case "${PROVIDER}" in
          github)
            [[ "${REGISTRY}" == 'ghcr.io' ]] || { echo 'github provider only supports ghcr.io' >&2; exit 1; }
            ;;
          static)
            [[ -n "${USERNAME}" && -n "${PASSWORD}" ]] || { echo 'static provider requires username and password' >&2; exit 1; }
            ;;
          aliyun-acr)
            [[ -n "${OIDC_PROVIDER_ARN}" && -n "${ROLE_ARN}" && -n "${REGION_ID}" && -n "${INSTANCE_ID}" ]] || {
              echo 'aliyun-acr provider requires OIDC provider ARN, role ARN, region ID, and instance ID' >&2
              exit 1
            }
            ;;
          *)
            echo "unsupported registry provider: ${PROVIDER}" >&2
            exit 1
            ;;
        esac

    - name: Log in to GitHub Container Registry
      if: ${{ inputs.provider == 'github' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Log in to a static-credential registry
      if: ${{ inputs.provider == 'static' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Exchange GitHub OIDC token for Alibaba RAM credentials
      if: ${{ inputs.provider == 'aliyun-acr' }}
      id: aliyun-credentials
      uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
      with:
        oidc-provider-arn: ${{ inputs.oidc-provider-arn }}
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ${{ inputs.role-session-name }}
        audience: ${{ inputs.audience }}

    - name: Log in to Alibaba Cloud Container Registry
      if: ${{ inputs.provider == 'aliyun-acr' }}
      uses: aliyun/acr-login@1840dbaffb41a83ec8ce19d5c1088e8776eb9bc3
      with:
        login-server: https://${{ inputs.registry }}
        region-id: ${{ inputs.region-id }}
        instance-id: ${{ inputs.instance-id }}
        access-key-id: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
        access-key-secret: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
        security-token: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
