name: Synchronize deployment Project

on:
  workflow_call:
    inputs:
      service:
        description: Project item title used as the service key.
        type: string
        required: true
      environment:
        description: Deployment environment.
        type: string
        required: true
      server:
        description: Deployment server.
        type: string
        required: true
      state:
        description: Deployment state.
        type: string
        required: true
      image-digest:
        description: Published image digest.
        type: string
        required: false
      deployed-at:
        description: Deployment timestamp in ISO 8601 format.
        type: string
        required: true
      project-number:
        description: Organization Project number.
        type: string
        default: '6'
    secrets:
      project_sync_token:
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Update deployment Project
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PROJECT_NUMBER: ${{ inputs.project-number }}
          SERVICE: ${{ inputs.service }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_SERVER: ${{ inputs.server }}
          DEPLOYMENT_STATE: ${{ inputs.state }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          DEPLOYED_AT: ${{ inputs.deployed-at }}
        with:
          github-token: ${{ secrets.project_sync_token }}
          script: |
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            if (!Number.isInteger(projectNumber)) throw new Error('project-number must be an integer');

            const query = `
              query($login: String!, $number: Int!) {
                organization(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2Field { id name }
                        ... on ProjectV2SingleSelectField { id name options { id name } }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          __typename
                          ... on DraftIssue { title }
                          ... on Issue { title }
                          ... on PullRequest { title }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(query, { login: 'ZiqiangStudio', number: projectNumber });
            const project = data.organization?.projectV2;
            if (!project) throw new Error(`Project ${projectNumber} was not found`);

            const field = name => {
              const value = project.fields.nodes.find(node => node.name === name);
              if (!value) throw new Error(`Project field was not found: ${name}`);
              return value;
            };
            const singleSelect = (name, optionName) => {
              const value = field(name);
              if (!value.options) throw new Error(`${name} is not a single-select field`);
              const option = value.options.find(option => option.name === optionName);
              if (!option) throw new Error(`Option ${optionName} was not found in ${name}`);
              return [value.id, option.id];
            };
            const update = async (fieldId, value) => {
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: $value
                  }) { projectV2Item { id } }
                }
              `, { projectId: project.id, itemId: item.id, fieldId, value });
            };

            let item = project.items.nodes.find(node => node.content?.title === process.env.SERVICE);
            if (!item) {
              const created = await github.graphql(`
                mutation($projectId: ID!, $title: String!, $body: String!) {
                  addProjectV2DraftIssue(input: { projectId: $projectId, title: $title, body: $body }) {
                    projectItem { id }
                  }
                }
              `, {
                projectId: project.id,
                title: process.env.SERVICE,
                body: `服务：${process.env.SERVICE}`,
              });
              item = created.addProjectV2DraftIssue.projectItem;
            }

            await update(field('服务').id, { text: process.env.SERVICE });
            const [environmentField, environmentOption] = singleSelect('环境', process.env.DEPLOYMENT_ENVIRONMENT);
            await update(environmentField, { singleSelectOptionId: environmentOption });
            const [serverField, serverOption] = singleSelect('服务器', process.env.DEPLOYMENT_SERVER);
            await update(serverField, { singleSelectOptionId: serverOption });
            const [stateField, stateOption] = singleSelect('部署状态', process.env.DEPLOYMENT_STATE);
            await update(stateField, { singleSelectOptionId: stateOption });
            if (process.env.IMAGE_DIGEST) await update(field('镜像 Digest').id, { text: process.env.IMAGE_DIGEST });
            await update(field('最近部署').id, { date: process.env.DEPLOYED_AT.slice(0, 10) });

            core.info(`Project ${projectNumber}: ${process.env.SERVICE} -> ${process.env.DEPLOYMENT_STATE}`);
