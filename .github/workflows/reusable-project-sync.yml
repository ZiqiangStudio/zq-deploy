name: Publish deployment event

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and deployment target environment.
        type: string
        required: true
      server:
        description: Deployment server identifier.
        type: string
        required: true
      state:
        description: Platform deployment state.
        type: string
        required: true
      image-digest:
        description: Published image digest.
        type: string
        required: false

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Publish deployment event
    runs-on: ubuntu-24.04
    steps:
      - name: Create deployment event
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_SERVER: ${{ inputs.server }}
          DEPLOYMENT_STATE: ${{ inputs.state }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        with:
          github-token: ${{ github.token }}
          script: |
            const state = process.env.DEPLOYMENT_STATE;
            const stateMap = {
              部署中: 'in_progress',
              成功: 'success',
              失败: 'failure',
              回滚: 'failure',
            };
            const deploymentState = stateMap[state] ?? state;
            const validStates = new Set(['error', 'failure', 'inactive', 'in_progress', 'queued', 'success']);
            if (!validStates.has(deploymentState)) throw new Error(`Unsupported deployment state: ${state}`);

            const payload = JSON.stringify({
              server: process.env.DEPLOYMENT_SERVER,
              platform_state: state,
              image_digest: process.env.IMAGE_DIGEST || null,
              deployed_at: new Date().toISOString(),
            });
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: `部署 ${state}：${process.env.DEPLOYMENT_SERVER}`,
              payload,
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: deploymentState,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: `部署 ${state}：${process.env.DEPLOYMENT_SERVER}`,
            });
            core.info(`Published deployment ${deployment.id} for ${context.repo.full_name}`);
