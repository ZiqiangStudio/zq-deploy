name: Reusable container deployment

on:
  workflow_call:
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
    inputs:
      context:
        description: Docker build context.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      image:
        description: Fully qualified image name without a tag.
        type: string
        required: true
      registry:
        description: Container registry hostname.
        type: string
        default: ghcr.io
      deploy:
        description: Run the project's deployment adapter after publishing the image.
        type: boolean
        default: false
      deploy-script:
        description: Project-local deployment adapter.
        type: string
        default: .platform/deploy.sh
      environment:
        description: GitHub Environment used for deployment protection and secrets.
        type: string
        default: staging
      deploy-runner:
        description: Hosted runner or one custom self-hosted runner label.
        type: string
        default: ubuntu-24.04
    outputs:
      image-digest:
        description: Digest of the published image.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to external container registry
        if: ${{ github.event_name != 'pull_request' && inputs.registry != 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy container
    needs: image
    if: ${{ inputs.deploy && github.event_name != 'pull_request' }}
    runs-on: ${{ inputs.deploy-runner }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: zq-platform-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out deployment adapter
        uses: actions/checkout@v7

      - name: Run deployment adapter
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_REF: ${{ inputs.image }}@${{ needs.image.outputs.digest }}
          GITHUB_SHA: ${{ github.sha }}
          SERVICE_IMAGE: ${{ inputs.image }}
        run: bash "${{ inputs.deploy-script }}"
