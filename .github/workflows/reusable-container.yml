name: Reusable container build and deployment

on:
  workflow_call:
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
    inputs:
      images:
        description: JSON array of images to build or pin.
        type: string
        default: ''
      registry:
        description: Central container registry hostname.
        type: string
        default: registry.cn-hangzhou.aliyuncs.com
      registry-provider:
        description: Registry authentication adapter.
        type: string
        default: static
      registry-region:
        description: Provider-specific registry region.
        type: string
        default: ''
      registry-instance-id:
        description: Provider-specific registry instance identifier.
        type: string
        default: ''
      registry-oidc-provider-arn:
        description: Provider-specific OIDC provider ARN.
        type: string
        default: ''
      registry-role-arn:
        description: Provider-specific role ARN.
        type: string
        default: ''
      registry-audience:
        description: Provider-specific OIDC audience.
        type: string
        default: ''
      registry-namespace:
        description: Central container registry namespace.
        type: string
        default: ziqiang_studio
      internal-registry:
        description: Central internal registry hostname for dependency images.
        type: string
        default: ''
      deploy:
        description: Create a GitHub Deployment for the central control plane after publishing images.
        type: boolean
        default: true
      environment:
        description: GitHub Environment and logical deployment target.
        type: string
        default: production
      validate-script:
        description: Project-local deployment contract validation script.
        type: string
        default: ""
      domain:
        description: Public domain(s) for Traefik routing (comma-separated).
        type: string
        default: ''
      port:
        description: Application port for the Traefik load balancer.
        type: string
        default: ''
      healthcheck-path:
        description: Container healthcheck HTTP path.
        type: string
        default: ''
    outputs:
      image-refs:
        description: JSON object mapping image names to immutable refs.
        value: ${{ jobs.image.outputs.image-refs }}
      image-digest:
        description: Digest of the first built image.
        value: ${{ jobs.image.outputs.image-digest }}

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

jobs:
  validate:
    name: Validate project and deployment contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -Eeuo pipefail
          echo "Validating PR title: '${TITLE}'"
          node -e '
            const title = process.env.TITLE || "";
            const regex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._\/-]+\))?!?: [\u4e00-\u9fff].+/;
            if (!regex.test(title)) {
              console.error(`::error::PR 标题 "${title}" 不符合规范。格式须为: <type>(<scope>): <中文描述>，例如: feat(auth): 升级登录流程`);
              process.exit(1);
            }
          '
          echo "✅ PR 标题格式校验通过"

      - name: Validate naming conventions
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          IMAGES_INPUT: ${{ inputs.images }}
        run: |
          set -Eeuo pipefail
          repo="${REPO_NAME}"
          echo "Validating repository and service naming: ${repo}"
          if ! [[ "${repo}" =~ ^[a-z0-9][a-z0-9._-]*[a-z0-9]$ ]]; then
            echo "::error::仓库名称 '${repo}' 不符合规范。命名仅允许小写字母、数字、中划线与下划线。"
            exit 1
          fi

          repo_clean="${repo//_/-}"

          if [[ -n "${IMAGES_INPUT}" ]]; then
            command -v jq >/dev/null
            while IFS= read -r img_name; do
              [[ -n "${img_name}" ]] || continue
              img_clean="${img_name//_/-}"
              if ! [[ "${img_clean}" =~ ^${repo_clean}(-[a-z0-9-]+)?$ ]] && ! [[ "${img_clean}" =~ ^(caddy|redis|meilisearch|office)$ ]]; then
                echo "::error::镜像或服务名称 '${img_name}' 不符合规范。必须以仓库名称 '${repo}' 为前缀（例如 '${repo}-api' 或 '${repo}'）。"
                exit 1
              fi
            done < <(jq -r 'if type == "array" then .[].image else empty end' <<<"${IMAGES_INPUT}")
          fi

          while IFS= read -r compose_file; do
            [[ -f "${compose_file}" ]] || continue
            [[ "${compose_file}" =~ /templates/ ]] && continue
            proj_name=$(grep -E '^[[:space:]]*name:[[:space:]]*' "${compose_file}" | head -n 1 | awk '{print $2}' | tr -d '"'\'' ' || true)
            if [[ -n "${proj_name}" ]] && ! [[ "${proj_name}" =~ ^\$ ]]; then
              proj_clean="${proj_name//_/-}"
              if [[ "${proj_clean}" != "${repo_clean}" ]] && ! [[ "${proj_clean}" =~ ^${repo_clean} ]]; then
                echo "::error file=${compose_file}::Compose 项目名称 '${proj_name}' 与仓库名称 '${repo}' 不一致，必须以仓库名作为统一命名空间。"
                exit 1
              fi
            fi
          done < <(find . -maxdepth 3 -type f \( -name "*compose*.yml" -o -name "*compose*.yaml" \) ! -path "*/.*/*" 2>/dev/null || true)
          echo "✅ 统一服务与容器命名契约校验通过"

      - name: Check no local database containers
        run: |
          set -Eeuo pipefail
          disallowed_regex='image:[[:space:]]*["'\'']?(mysql|mariadb|postgres|postgresql|mongo|mongodb)(:[^[:space:]"\''#]+)?'
          dockerfile_regex='^FROM[[:space:]]+(mysql|mariadb|postgres|postgresql|mongo|mongodb)'
          failed=0

          while IFS= read -r file; do
            if grep -E -i "${disallowed_regex}" "${file}" >/dev/null 2>&1; then
              echo "::error file=${file}::检测到禁止的本地自建数据库镜像。生产环境数据库必须使用自强统一的阿里云 RDS MySQL，缓存使用服务器统一 redis-shared，严禁在生产配置中自建数据库容器。"
              failed=1
            fi
          done < <(find . -maxdepth 3 -type f \( -name "*compose*.yml" -o -name "*compose*.yaml" \) ! -path "*/.*/*" 2>/dev/null || true)

          while IFS= read -r file; do
            if grep -E -i "${dockerfile_regex}" "${file}" >/dev/null 2>&1; then
              echo "::error file=${file}::检测到基于原生数据库镜像的 Dockerfile。生产环境严禁直接打包或自建本地数据库容器。"
              failed=1
            fi
          done < <(find . -maxdepth 3 -type f \( -name "Dockerfile*" -o -name "*.dockerfile" \) ! -path "*/.*/*" 2>/dev/null || true)

          if (( failed != 0 )); then
            exit 1
          fi
          echo "✅ 无本地自建数据库校验通过"

  image:
    needs: validate
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: Build and publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-refs: ${{ steps.build.outputs.image-refs }}
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: ZiqiangStudio/zq-deploy/.github/actions/registry-login@main
        with:
          provider: ${{ inputs.registry-provider }}
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username || secrets.DOCKER_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.registry_password || secrets.DOCKER_PASSWORD || secrets.REGISTRY_PASSWORD }}
          oidc-provider-arn: ${{ inputs.registry-oidc-provider-arn }}
          role-arn: ${{ inputs.registry-role-arn }}
          region-id: ${{ inputs.registry-region }}
          instance-id: ${{ inputs.registry-instance-id }}
          audience: ${{ inputs.registry-audience }}

      - name: Build and publish images
        id: build
        env:
          IMAGE_DEFINITIONS: ${{ inputs.images }}
          DEFAULT_IMAGE: ${{ github.event.repository.name }}
          PUSH_IMAGES: ${{ github.event_name != 'pull_request' }}
          REGISTRY_HOST: ${{ inputs.registry }}
          REGISTRY_NAMESPACE: ${{ inputs.registry-namespace }}
          INTERNAL_REGISTRY_HOST: ${{ inputs.internal-registry }}
        run: |
          set -Eeuo pipefail
          command -v jq >/dev/null
          definitions="${IMAGE_DEFINITIONS}"
          if [[ -z "${definitions}" ]]; then
            definitions="[{\"name\":\"default\",\"image\":\"${DEFAULT_IMAGE}\"}]"
          fi
          refs='{}'
          first_digest=''

          while IFS= read -r item; do
            name=$(jq -er '.name' <<<"${item}")
            build=$(jq -r 'if has("build") then .build else true end' <<<"${item}")
            if [[ "${build}" == 'false' ]]; then
              image=$(jq -er '.image' <<<"${item}")
              digest=$(jq -er '.digest | select(test("^sha256:"))' <<<"${item}")
              registry_kind=$(jq -r '.registry // "main"' <<<"${item}")
              case "${registry_kind}" in
                main) dependency_registry="${REGISTRY_HOST}" ;;
                internal)
                  [[ -n "${INTERNAL_REGISTRY_HOST}" ]] || { echo 'internal-registry is required for internal dependencies' >&2; exit 1; }
                  dependency_registry="${INTERNAL_REGISTRY_HOST}" ;;
                *) echo "unsupported dependency registry: ${registry_kind}" >&2; exit 1 ;;
              esac
              ref="${dependency_registry}/${REGISTRY_NAMESPACE}/${image}@${digest}"
              refs=$(jq -c --arg name "${name}" --arg ref "${ref}" '. + {($name): $ref}' <<<"${refs}")
              continue
            fi

            image=$(jq -er '.image' <<<"${item}")
            image="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${image}"
            context=$(jq -r '.context // "."' <<<"${item}")
            dockerfile=$(jq -r '.dockerfile // "Dockerfile"' <<<"${item}")
            metadata=$(mktemp)
            output_args=(--load)
            attest_args=(--provenance=false --sbom=false)
            if [[ "${PUSH_IMAGES}" == 'true' && "${REGISTRY_HOST}" == 'ghcr.io' ]]; then
              output_args=(--push)
              attest_args=(--provenance=true --sbom=true)
            elif [[ "${PUSH_IMAGES}" == 'true' ]]; then
              output_args=(--push)
            fi

            docker buildx build \
              --file "${dockerfile}" \
              --tag "${image}:${name}-${GITHUB_SHA}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --metadata-file "${metadata}" \
              "${attest_args[@]}" \
              "${output_args[@]}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "${context}"

            if [[ "${PUSH_IMAGES}" == 'true' ]]; then
              digest=$(jq -er '.["containerimage.digest"]' "${metadata}")
              ref="${image}@${digest}"
              [[ -n "${first_digest}" ]] || first_digest="${digest}"
            else
              ref="${image}:${name}-${GITHUB_SHA}"
            fi
            refs=$(jq -c --arg name "${name}" --arg ref "${ref}" '. + {($name): $ref}' <<<"${refs}")
            rm -f "${metadata}"
          done < <(jq -cer 'if type == "array" and length > 0 then .[] else error("images must be a non-empty array") end' <<<"${definitions}")

          echo "image-refs=${refs}" >>"${GITHUB_OUTPUT}"
          echo "image-digest=${first_digest}" >>"${GITHUB_OUTPUT}"

      - name: Validate deployment contract
        if: ${{ github.event_name == 'pull_request' && inputs.validate-script != '' }}
        env:
          IMAGE_REFS: ${{ steps.build.outputs.image-refs }}
        run: bash "${{ inputs.validate-script }}"

  deploy:
    if: ${{ inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: image
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image-refs: ${{ needs.image.outputs.image-refs }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      domain: ${{ inputs.domain }}
      port: ${{ inputs.port }}
      healthcheck-path: ${{ inputs.healthcheck-path }}
    permissions:
      contents: read
      deployments: write
