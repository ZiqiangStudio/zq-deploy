name: Reusable container deployment

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      image:
        description: Fully qualified image name without a tag.
        type: string
        required: true
      deploy:
        description: Run the project's deployment adapter after publishing the image.
        type: boolean
        default: false
      deploy-script:
        description: Project-local deployment adapter.
        type: string
        default: .platform/deploy.sh
      environment:
        description: GitHub Environment used for deployment protection and secrets.
        type: string
        default: staging
    outputs:
      image-digest:
        description: Digest of the published image.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy container
    needs: image
    if: ${{ inputs.deploy && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out deployment adapter
        uses: actions/checkout@v5

      - name: Run deployment adapter
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_REF: ${{ inputs.image }}@${{ needs.image.outputs.digest }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash "${{ inputs.deploy-script }}"
