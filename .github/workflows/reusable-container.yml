name: Reusable container deployment

on:
  workflow_call:
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      DEPLOY_SSH_PRIVATE_KEY:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false
    inputs:
      images:
        description: JSON array of images to build or pin.
        type: string
        required: true
      registry:
        description: Container registry hostname.
        type: string
        default: ghcr.io
      internal-registry:
        description: Optional second registry hostname used by dependency images.
        type: string
        default: ""
      deploy:
        description: Run the project's deployment adapter after publishing images.
        type: boolean
        default: false
      deploy-script:
        description: Project-local deployment adapter.
        type: string
        default: .platform/deploy.sh
      validate-script:
        description: Project-local deployment contract validation script.
        type: string
        default: ""
      environment:
        description: GitHub Environment used for deployment protection and secrets.
        type: string
        required: true
      deploy-runner:
        description: Hosted runner or one custom self-hosted runner label.
        type: string
        default: ubuntu-24.04
    outputs:
      image-refs:
        description: JSON object mapping image names to immutable refs.
        value: ${{ jobs.image.outputs.image-refs }}
      image-digest:
        description: Digest of the first built image.
        value: ${{ jobs.image.outputs.image-digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: Build and publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-refs: ${{ steps.build.outputs.image-refs }}
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to external container registry
        if: ${{ github.event_name != 'pull_request' && inputs.registry != 'ghcr.io' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build and publish images
        id: build
        env:
          IMAGE_DEFINITIONS: ${{ inputs.images }}
          PUSH_IMAGES: ${{ github.event_name != 'pull_request' }}
          REGISTRY_HOST: ${{ inputs.registry }}
        run: |
          set -Eeuo pipefail
          command -v jq >/dev/null
          refs='{}'
          first_digest=''

          while IFS= read -r item; do
            name=$(jq -er '.name' <<<"${item}")
            build=$(jq -r 'if has("build") then .build else true end' <<<"${item}")
            if [[ "${build}" == 'false' ]]; then
              ref=$(jq -er '.ref | select(test("@sha256:"))' <<<"${item}")
              refs=$(jq -c --arg name "${name}" --arg ref "${ref}" '. + {($name): $ref}' <<<"${refs}")
              continue
            fi

            image=$(jq -er '.image' <<<"${item}")
            context=$(jq -r '.context // "."' <<<"${item}")
            dockerfile=$(jq -r '.dockerfile // "Dockerfile"' <<<"${item}")
            metadata=$(mktemp)
            output_args=(--load)
            attest_args=(--provenance=false --sbom=false)
            if [[ "${PUSH_IMAGES}" == 'true' && "${REGISTRY_HOST}" == 'ghcr.io' ]]; then
              output_args=(--push)
              attest_args=(--provenance=true --sbom=true)
            elif [[ "${PUSH_IMAGES}" == 'true' ]]; then
              output_args=(--push)
            fi

            docker buildx build \
              --file "${dockerfile}" \
              --tag "${image}:${name}-${GITHUB_SHA}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --metadata-file "${metadata}" \
              "${attest_args[@]}" \
              "${output_args[@]}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "${context}"

            if [[ "${PUSH_IMAGES}" == 'true' ]]; then
              digest=$(jq -er '.["containerimage.digest"]' "${metadata}")
              ref="${image}@${digest}"
              [[ -n "${first_digest}" ]] || first_digest="${digest}"
            else
              ref="${image}:${name}-${GITHUB_SHA}"
            fi
            refs=$(jq -c --arg name "${name}" --arg ref "${ref}" '. + {($name): $ref}' <<<"${refs}")
            rm -f "${metadata}"
          done < <(jq -cer 'if type == "array" and length > 0 then .[] else error("images must be a non-empty array") end' <<<"${IMAGE_DEFINITIONS}")

          echo "image-refs=${refs}" >>"${GITHUB_OUTPUT}"
          echo "image-digest=${first_digest}" >>"${GITHUB_OUTPUT}"

      - name: Validate deployment contract
        if: ${{ github.event_name == 'pull_request' && inputs.validate-script != '' }}
        env:
          IMAGE_REFS: ${{ steps.build.outputs.image-refs }}
        run: bash "${{ inputs.validate-script }}"

  deploy:
    name: Deploy containers
    needs: image
    if: ${{ inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ inputs.deploy-runner }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: zq-platform-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run deployment adapter
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_REFS: ${{ needs.image.outputs.image-refs }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_HOST: ${{ inputs.registry }}
          INTERNAL_REGISTRY_HOST: ${{ inputs.internal-registry }}
          REGISTRY_USERNAME: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.registry_username }}
          REGISTRY_TOKEN: ${{ inputs.registry == 'ghcr.io' && github.token || secrets.registry_password }}
        run: bash "${{ inputs.deploy-script }}"
