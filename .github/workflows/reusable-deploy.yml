name: Deploy on self-hosted runner

on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      RUNTIME_ENV:
        required: true
    inputs:
      environment:
        description: GitHub Environment and deployment target.
        type: string
        default: production
      image-refs:
        description: JSON object of logical image names to immutable digest references.
        type: string
        required: true
      registry:
        description: Container registry hostname.
        type: string
        default: registry.cn-hangzhou.aliyuncs.com
      manifest-root:
        description: Directory containing <service>/compose.yml on the runner.
        type: string
        default: /etc/zq-deploy/deployments
      compose-file:
        description: Repository-relative compose file that defines the service topology.
        type: string
        default: .platform/compose.yml

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux, x64, zq-deploy]
    environment: ${{ inputs.environment }}
    concurrency:
      group: zq-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate image references
        shell: bash
        env:
          IMAGE_REFS: ${{ inputs.image-refs }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          jq -e '
            type == "object" and length > 0 and
            all(to_entries[]; (.key | test("^[a-zA-Z0-9._-]+$")) and (.value | test("^.+@sha256:[0-9a-f]{64}$")))
          ' <<<"${IMAGE_REFS}" >/dev/null

      - name: Log in to registry
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${REGISTRY_USERNAME}" && -n "${REGISTRY_PASSWORD}" ]] || { echo 'DOCKER_USERNAME and DOCKER_PASSWORD are required' >&2; exit 1; }
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Create deployment
        id: deployment
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_REFS: ${{ inputs.image-refs }}
        with:
          github-token: ${{ github.token }}
          script: |
            const imageRefs = JSON.parse(process.env.IMAGE_REFS);
            const payload = {
              schema: 'zq-platform/deployment/v1',
              service: context.repo.repo,
              repository: context.repo.owner + '/' + context.repo.repo,
              sha: context.sha,
              image_refs: imageRefs,
            };
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: `Deploy ${process.env.DEPLOYMENT_ENVIRONMENT}`,
              payload: JSON.stringify(payload),
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'in_progress',
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: 'Deploying',
              auto_inactive: false,
            });
            core.setOutput('id', deployment.id);

      - name: Check out deployment source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out deployment platform
        uses: actions/checkout@v7
        with:
          repository: ZiqiangStudio/zq-deploy
          ref: main
          path: .zq-deploy-platform
          persist-credentials: false

      - name: Stage compose manifest
        shell: bash
        env:
          SERVICE: ${{ github.event.repository.name }}
          MANIFEST_ROOT: ${{ inputs.manifest-root }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail
          test -f "${COMPOSE_FILE}" || { echo "missing compose file: ${COMPOSE_FILE}" >&2; exit 1; }
          install -Dm644 "${COMPOSE_FILE}" "${MANIFEST_ROOT}/${SERVICE}/compose.yml.candidate"
          echo "Staged compose manifest"

      - name: Export image references
        shell: bash
        env:
          IMAGE_REFS: ${{ inputs.image-refs }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name ref; do
            if [[ "${name}" == 'default' ]]; then
              key=IMAGE_REF
            else
              key="$(printf '%s' "${name}" | tr '[:lower:].-' '[:upper:]__')_IMAGE_REF"
            fi
            printf '%s=%s\n' "${key}" "${ref}" >>"${GITHUB_ENV}"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<<"${IMAGE_REFS}")

      - name: Stage runtime environment
        shell: bash
        env:
          SERVICE: ${{ github.event.repository.name }}
          MANIFEST_ROOT: ${{ inputs.manifest-root }}
          RUNTIME_ENV: ${{ secrets.RUNTIME_ENV }}
        run: |
          set -euo pipefail
          [[ -n "${RUNTIME_ENV}" ]] || { echo "RUNTIME_ENV secret is required" >&2; exit 1; }
          directory="${MANIFEST_ROOT}/${SERVICE}"
          env_file="${directory}/.env.candidate"
          install -dm700 "${directory}"
          install -m600 /dev/null "${env_file}"
          python3 - "${env_file}" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = os.environ["RUNTIME_ENV"].replace("\r\n", "\n").replace("\r", "\n")
          if not content.endswith("\n"):
              content += "\n"

          seen = set()
          for raw in content.splitlines():
              line = raw.rstrip("\r")
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              key = line.split("=", 1)[0]
              if not re.fullmatch(r"[A-Z][A-Z0-9_]*", key):
                  raise SystemExit(f"invalid runtime env key: {key!r}")
              if key in seen:
                  raise SystemExit(f"duplicate runtime env key: {key}")
              seen.add(key)

          tmp = path.with_name(f".env.runtime.{os.getpid()}")
          tmp.write_text(content, encoding="utf-8")
          tmp.chmod(0o600)
          os.replace(tmp, path)
          PY
          echo "Staged runtime environment"

      - name: Validate staged deployment
        shell: bash
        env:
          SERVICE: ${{ github.event.repository.name }}
          MANIFEST_ROOT: ${{ inputs.manifest-root }}
          PLATFORM_ROOT: ${{ github.workspace }}/.zq-deploy-platform
        run: |
          set -euo pipefail
          directory="${MANIFEST_ROOT}/${SERVICE}"
          stage="$(mktemp -d "${directory}/.staging.XXXXXX")"
          trap 'rm -rf "${stage}"' EXIT
          cp "${directory}/compose.yml.candidate" "${stage}/compose.yml"
          install -m600 "${directory}/.env.candidate" "${stage}/.env"
          bash "${PLATFORM_ROOT}/scripts/check_candidate.sh" "${SERVICE}" "${stage}"

      - name: Promote deployment files
        shell: bash
        env:
          SERVICE: ${{ github.event.repository.name }}
          MANIFEST_ROOT: ${{ inputs.manifest-root }}
        run: |
          set -euo pipefail
          directory="${MANIFEST_ROOT}/${SERVICE}"
          test -s "${directory}/.env.candidate" || { echo "missing staged runtime environment" >&2; exit 1; }
          test -s "${directory}/compose.yml.candidate" || { echo "missing staged compose manifest" >&2; exit 1; }
          mv -f "${directory}/compose.yml.candidate" "${directory}/compose.yml"
          mv -f "${directory}/.env.candidate" "${directory}/.env"
          chmod 600 "${directory}/.env"
          echo "Promoted deployment files"

      - name: Clean stale staged files
        if: ${{ always() }}
        shell: bash
        env:
          SERVICE: ${{ github.event.repository.name }}
          MANIFEST_ROOT: ${{ inputs.manifest-root }}
        run: rm -f "${MANIFEST_ROOT}/${SERVICE}/.env.candidate" "${MANIFEST_ROOT}/${SERVICE}/compose.yml.candidate"

      - name: Roll out compose stack
        shell: bash
        env:
          SERVICE: ${{ github.event.repository.name }}
          SERVICE_NAME: ${{ github.event.repository.name }}
          COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}
          MANIFEST_ROOT: ${{ inputs.manifest-root }}
        run: |
          set -euo pipefail
          directory="${MANIFEST_ROOT}/${SERVICE}"
          manifest="${directory}/compose.yml"
          test -f "${manifest}" || { echo "missing deployment manifest: ${manifest}" >&2; exit 1; }
          docker compose --project-directory "${directory}" --file "${manifest}" pull
          # env_file contents are excluded from the compose config hash, so recreate on every rollout.
          docker compose --project-directory "${directory}" --file "${manifest}" up -d --remove-orphans --force-recreate

          for attempt in $(seq 1 60); do
            if docker compose --project-directory "${directory}" --file "${manifest}" ps --all --format json \
              | jq -s -e '(if length == 1 and (.[0] | type == "array") then .[0] else . end) | length > 0 and all(.[]; .State == "running" and ((.Health // "") == "" or .Health == "healthy"))' >/dev/null; then
              # Recreated containers leave the previous digest image unreferenced.
              docker image prune -f >/dev/null 2>&1 || true
              docker compose --project-directory "${directory}" --file "${manifest}" ps
              exit 0
            fi
            sleep 5
          done

          echo "compose stack did not become healthy within 300 seconds" >&2
          docker compose --project-directory "${directory}" --file "${manifest}" ps -a >&2
          exit 1

      - name: Mark deployment successful
        if: ${{ success() && steps.deployment.outputs.id != '' }}
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'success',
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: 'Deployed',
              auto_inactive: false,
            });

      - name: Mark deployment failed
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.id != '' }}
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'failure',
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: 'Deployment failed',
              auto_inactive: false,
            });
