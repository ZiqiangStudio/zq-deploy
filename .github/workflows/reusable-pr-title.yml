name: Validate pull request title

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate pull request title
    runs-on: ubuntu-24.04
    steps:
      - name: Validate title format
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PULL_REQUEST_TITLE"]
          pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(?:\([a-z0-9][a-z0-9._/-]*\))?!?: [\u4e00-\u9fff].+$"
          )
          if not pattern.fullmatch(title):
              print(f"无效的 PR 标题：{title}")
              print("格式：type(scope): 中文描述")
              print("示例：fix(deploy): 修复部署健康检查")
              sys.exit(1)
          print(f"PR 标题格式正确：{title}")
          PY
