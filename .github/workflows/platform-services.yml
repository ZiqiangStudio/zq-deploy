name: Deploy services

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - '.github/actions/registry-login/**'
      - '.github/workflows/platform-services.yml'
      - '.github/workflows/reusable-container.yml'
      - 'services/**'
      - 'adapters/registry/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/registry-login/**'
      - '.github/workflows/platform-services.yml'
      - '.github/workflows/reusable-container.yml'
      - 'services/**'
      - 'adapters/registry/**'

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

jobs:
  services:
    uses: ./.github/workflows/reusable-container.yml
    secrets: inherit
    with:
      images: >-
        [{"name":"control","image":"zq-deploy-control","context":"services/deployment-control","dockerfile":"services/deployment-control/Dockerfile"},{"name":"agent","image":"zq-deploy-agent","context":"services/deploy-agent","dockerfile":"services/deploy-agent/Dockerfile"}]
