name: Reusable static deployment

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the project.
        type: string
        default: '24.x'
      working-directory:
        description: Directory containing package.json and package-lock.json.
        type: string
        default: .
      build-command:
        description: Command that creates the static artifact.
        type: string
        required: true
      artifact-path:
        description: Path to the generated static artifact.
        type: string
        required: true
      deploy:
        description: Run the project's .platform/deploy.sh after a successful build.
        type: boolean
        default: false
      deploy-script:
        description: Project-local deployment adapter.
        type: string
        default: .platform/deploy.sh
      environment:
        description: GitHub Environment used for deployment protection and secrets.
        type: string
        default: staging
    outputs:
      artifact-name:
        description: Uploaded artifact name.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build static artifact
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: static-${{ github.sha }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-${{ github.sha }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy static artifact
    needs: build
    if: ${{ inputs.deploy && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Check out deployment adapter
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: artifact

      - name: Run deployment adapter
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_PATH: ${{ github.workspace }}/artifact
          GITHUB_SHA: ${{ github.sha }}
        run: bash "${{ inputs.deploy-script }}"
