name: Validate platform contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate inventory
        run: python scripts/validate_inventory.py
      - name: Parse YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('all YAML files parsed')
          PY
