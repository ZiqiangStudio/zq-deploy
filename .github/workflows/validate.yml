name: Validate platform contracts

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    uses: ./.github/workflows/reusable-pr-title.yml

  validate:
    if: github.event.action != 'edited'
    runs-on: [self-hosted, linux, x64, zq-deploy]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Parse YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('all YAML files parsed')
          PY
