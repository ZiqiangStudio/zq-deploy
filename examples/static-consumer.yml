name: Deploy static site

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  deploy:
    uses: ZiqiangStudio/zq-platform/.github/workflows/reusable-static.yml@<pinned-ref>
    with:
      build-command: npm run build
      artifact-path: dist
      deploy: ${{ github.event_name == 'push' }}
      environment: production
      deploy-runner: ubuntu-24.04
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      actions: read
