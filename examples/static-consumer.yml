name: Deploy static site

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  deploy:
    uses: ZiqiangStudio/zq-platform/.github/workflows/reusable-static.yml@main
    with:
      build-command: npm run build
      artifact-path: dist
      deploy: ${{ github.event_name == 'push' }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
      actions: read
