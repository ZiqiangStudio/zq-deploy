name: Deploy container service

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ZiqiangStudio/zq-deploy/.github/workflows/reusable-container.yml@main
    secrets: inherit
    with:
      images: >-
        [{"name":"default","image":"example-service"}]
      deploy: true
      environment: production
      validate-script: .platform/validate.sh
