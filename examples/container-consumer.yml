name: Deploy container service

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ZiqiangStudio/zq-platform/.github/workflows/reusable-container.yml@main
    with:
      images: >-
        [{"name":"default","image":"example-service"}]
      deploy: true
      environment: production
      deploy-runner: ubuntu-24.04
    secrets: inherit
    permissions:
      contents: read
      packages: write
